<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理マスター</title>
<style>
  :root { --accent:#0aa5c9; --bg:#ffffff; --fg:#1a1a1a; --muted:#6a6a6a; --line:#e5e8ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111417; --fg:#e9edf0; --muted:#9aa3ab; --line:#2a2f34; } }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
         background:var(--bg); color:var(--fg); line-height:1.8; text-align:center; }
  .hero { background:linear-gradient(135deg,#16beaa,#1fb0d6,#2a78d6); color:#fff; padding:72px 24px; }
  .hero h1 { margin:0; font-size:32px; font-weight:700; }
  .hero p { margin:10px 0 0; opacity:.92; }
  main { max-width:520px; margin:0 auto; padding:40px 24px; }
  a.btn { display:block; margin:14px 0; padding:16px; border:1px solid var(--line); border-radius:12px;
          text-decoration:none; color:var(--fg); font-weight:600; }
  a.btn:hover { border-color:var(--accent); }
  footer { color:var(--muted); font-size:12px; padding:24px; }
</style>
</head>
<body>
  <div class="hero">
    <h1>物理マスター</h1>
    <p>共通テスト・定期テスト対策 ｜ 物理基礎</p>
  </div>
  <main>
    <a class="btn" href="support.html">サポート / よくある質問</a>
    <a class="btn" href="privacy.html">プライバシーポリシー</a>
  </main>
  <footer>© © 2026 i want</footer>
</body>
</html>
